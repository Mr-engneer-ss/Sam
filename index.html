<!DOCTYPE html>
<!--
  نظام حجز الدروس الخصوصية — ملف واحد، بدون سيرفر أو قاعدة بيانات.
  رمز دخول لوحة التحكم الافتراضي: 1234  (غيّره من لوحة التحكم > الإعدادات)
  ملاحظة: البيانات تُحفظ في LocalStorage داخل متصفح كل مستخدم، والرمز هنا لا يوفّر أماناً حقيقياً.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#4f46e5">
<meta name="description" content="احجز درساً خصوصياً بسهولة: اختر المادة والمدرس والموعد.">
<title>دروس خصوصية | احجز درسك</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📚%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb;--card:#fff;--text:#1b2437;--muted:#64748b;--line:#e5e9f2;
  --primary:#4f46e5;--primary-text:#4338ca;--primary-l:#eef0ff;--accent:#14b8a6;
  --danger:#e11d48;--danger-l:#ffe4ea;--ok:#16a34a;--ok-l:#dcfce7;--warn:#b45309;--warn-l:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);--r:16px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1322;--card:#161d33;--text:#e8ecf7;--muted:#94a0bb;--line:#26304d;
    --primary:#6366f1;--primary-text:#a5b4fc;--primary-l:#1f2850;
    --danger:#f43f5e;--danger-l:#3a1823;--ok:#22c55e;--ok-l:#12301e;--warn:#fbbf24;--warn-l:#3a2c10;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Cairo","Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
h1,h2,h3,h4{line-height:1.4}
.wrap{max-width:1040px;margin-inline:auto;padding-inline:16px}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* Header */
.topbar{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--accent));font-size:20px}
nav{display:flex;gap:6px}
nav button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap}
nav button.active{background:var(--primary-l);color:var(--primary-text)}
main{padding-block:24px 56px}

/* Hero & stepper */
.hero{background:linear-gradient(135deg,var(--primary),#7c3aed 60%,var(--accent));color:#fff;border-radius:24px;padding:28px 24px;margin-bottom:20px;box-shadow:var(--shadow)}
.hero h1{font-size:clamp(1.4rem,4vw,2rem)}
.hero p{opacity:.92;margin-top:6px}
.stepper{display:flex;gap:8px;list-style:none;padding:0;margin:0 0 18px;overflow-x:auto}
.stepper li{flex:1;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--muted);min-width:0}
.stepper li span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:.85rem;font-weight:700;flex:none}
.stepper li.active{border-color:var(--primary);color:var(--text)}
.stepper li.active span{background:var(--primary);color:#fff}
.stepper li.done span{background:var(--ok);color:#fff}

/* Cards & grids */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card.narrow{max-width:420px;margin:24px auto}
.page-title{font-size:1.35rem;margin-bottom:14px}
.section-title{font-size:1.05rem;margin:22px 0 10px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:start;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);transition:.15s}
.choice:hover:not(:disabled){border-color:var(--primary);transform:translateY(-2px)}
.choice:disabled{opacity:.5}
.choice .ico{font-size:2rem;line-height:1.2}
.choice b{font-size:1.1rem}
.teacher{gap:8px}
.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--primary),var(--accent))}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--primary-l);color:var(--primary-text);padding:2px 10px;border-radius:999px;font-size:.82rem;font-weight:600}
.day{margin-bottom:18px}
.day h4{margin-bottom:8px}
.slots{display:flex;flex-wrap:wrap;gap:10px}
.slot{display:flex;flex-direction:column;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 16px;font-weight:700;transition:.15s}
.slot small{font-weight:400;color:var(--muted)}
.slot:hover{border-color:var(--primary);background:var(--primary-l)}
.summary{display:grid;gap:6px;background:var(--primary-l);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.summary div{display:flex;justify-content:space-between;gap:10px}
.summary span:first-child{color:var(--muted)}
.empty{text-align:center;padding:36px 16px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}
.empty .big{font-size:2.4rem}
.success{text-align:center}
.success .check{width:72px;height:72px;margin:0 auto 10px;border-radius:50%;background:var(--ok-l);color:var(--ok);display:grid;place-items:center;font-size:2.2rem}

/* Forms */
label{display:block;font-weight:600;font-size:.92rem}
label>input,label>select,label>textarea{display:block;width:100%;margin-top:6px;font-weight:400}
input,select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 22%,transparent)}
input[type=checkbox]{width:auto;accent-color:var(--primary)}
.check-row{display:flex;align-items:center;gap:8px;font-weight:600}
.check-row input{margin:0}
textarea{resize:vertical;min-height:80px}
.stack{display:grid;gap:14px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;align-items:end}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>input{flex:1;min-width:180px}
.err{color:var(--danger);font-size:.88rem;min-height:1.2em}
.ltr{direction:ltr;unicode-bidi:isolate}

/* Buttons & badges */
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:700;background:var(--primary);color:#fff;transition:.15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--bg)}
.btn.danger{background:var(--danger)}
.btn.soft{background:var(--primary-l);color:var(--primary-text)}
.btn.sm{padding:6px 12px;font-size:.88rem;border-radius:10px}
.btn.block{width:100%}
.badge{display:inline-block;padding:1px 10px;border-radius:999px;font-size:.8rem;font-weight:700}
.badge.ok{background:var(--ok-l);color:var(--ok)}
.badge.danger{background:var(--danger-l);color:var(--danger)}
.badge.muted{background:var(--line);color:var(--muted)}
.badge.warn{background:var(--warn-l);color:var(--warn)}
.badge.info{background:var(--primary-l);color:var(--primary-text)}

/* Booking cards */
.list{display:grid;gap:12px}
.bk{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--primary);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.bk.cancelled{border-inline-start-color:var(--danger);opacity:.8}
.bk.done{border-inline-start-color:var(--muted);opacity:.85}
.bk-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bk p{margin-top:2px}
.bk .note{color:var(--muted);font-size:.9rem}
.bk-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* Admin */
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}
.tabs button{border:1.5px solid var(--line);background:var(--card);padding:8px 16px;border-radius:999px;font-weight:600;white-space:nowrap;color:var(--muted)}
.tabs button.active{background:var(--primary);border-color:var(--primary);color:#fff}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.9rem;line-height:1.2}
.stat span{color:var(--muted);font-size:.9rem}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.trow{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.trow.off{opacity:.6}
.srow{display:grid;grid-template-columns:1.2fr 1.6fr auto auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px}
.srow.booked{background:var(--primary-l)}
.settings{display:grid;gap:16px}

/* Modal & toasts */
.backdrop{position:fixed;inset:0;background:rgba(10,15,30,.55);display:grid;place-items:center;padding:16px;z-index:100;overflow:auto}
.modal{background:var(--card);border-radius:20px;padding:22px;width:100%;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h3{margin-bottom:10px}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions .btn{flex:1}
#toasts{position:fixed;inset-inline:0;bottom:20px;display:grid;justify-items:center;gap:8px;z-index:200;pointer-events:none;padding-inline:16px}
.toast{background:#1b2437;color:#fff;padding:10px 18px;border-radius:12px;box-shadow:var(--shadow);font-weight:600;animation:in .25s ease}
.toast.error{background:var(--danger)}
.toast.out{opacity:0;transition:.4s}
@keyframes in{from{transform:translateY(10px);opacity:0}}

@media (max-width:720px){
  nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:40;gap:4px}
  nav button{flex-direction:column;gap:0;font-size:.78rem;border-radius:12px;padding:6px 4px;justify-content:center}
  main{padding-bottom:100px}
  #toasts{bottom:92px}
  .stepper li b{display:none}
  .stepper li.active b{display:inline}
  .stepper li{flex:0 1 auto}
  .stepper li.active{flex:1}
  .bk{flex-direction:column}
  .bk-actions{justify-content:flex-start}
  .srow{grid-template-columns:1fr auto}
  .hero{padding:22px 18px;border-radius:20px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap bar">
    <div class="brand"><span class="logo">📚</span><span>دروس خصوصية</span></div>
    <nav id="nav" aria-label="التنقل الرئيسي">
      <button data-act="nav" data-view="book">📅 <span>حجز درس</span></button>
      <button data-act="nav" data-view="mine">🗂️ <span>حجوزاتي</span></button>
      <button data-act="nav" data-view="admin">⚙️ <span>لوحة التحكم</span></button>
    </nav>
  </div>
</header>
<main id="app" class="wrap"></main>
<div id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<noscript><p style="padding:24px;text-align:center">يتطلب هذا التطبيق تفعيل جافاسكربت.</p></noscript>

<script>
(() => {
'use strict';

/* ============ أدوات عامة ============ */
const KEY = 'tutor_booking_v1';
const PIN_KEY = 'tb_pin';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const slotStart = s => { const [h, mi] = s.time.split(':').map(Number); const d = parseISO(s.date); d.setHours(h, mi, 0, 0); return d; };
const slotEnd = s => new Date(slotStart(s).getTime() + s.duration * 60000);
const isPast = s => slotStart(s) <= new Date();
const bySlot = (a, b) => slotStart(a) - slotStart(b);
const overlaps = (a, b) => slotStart(a) < slotEnd(b) && slotStart(b) < slotEnd(a);

const dfLong = new Intl.DateTimeFormat('ar-EG-u-ca-gregory-nu-latn', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const fmtDate = iso => dfLong.format(parseISO(iso));
const fmtTime = t => { const [h, m] = t.split(':').map(Number); return `${h % 12 || 12}:${pad(m)} ${h >= 12 ? 'م' : 'ص'}`; };
const endHHMM = s => { const e = slotEnd(s); return `${pad(e.getHours())}:${pad(e.getMinutes())}`; };
const rangeText = s => `${fmtTime(s.time)} – ${fmtTime(endHHMM(s))}`;

const normPhone = s => String(s || '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g, '');
const samePhone = (a, b) => {
  const x = normPhone(a), y = normPhone(b);
  if (!x || !y) return false;
  if (x === y) return true;
  return x.length >= 9 && y.length >= 9 && x.slice(-9) === y.slice(-9);
};

const lsGet = (k, def = '') => { try { const v = localStorage.getItem(k); return v === null ? def : v; } catch { return def; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch { return false; } };
const ssGet = k => { try { return sessionStorage.getItem(k); } catch { return null; } };
const ssSet = (k, v) => { try { v === null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch {} };

const SUBJECT_ICONS = {'رياضيات':'🧮','فيزياء':'⚛️','كيمياء':'🧪','أحياء':'🧬','لغة إنجليزية':'🔤','اللغة الإنجليزية':'🔤','لغة عربية':'📝','اللغة العربية':'📝','تاريخ':'🏛️','جغرافيا':'🌍','برمجة':'💻','علوم':'🔬','لغة فرنسية':'🥖'};
const icon = s => SUBJECT_ICONS[s] || '📖';
const initial = n => { const c = String(n).replace(/^(الأستاذ|الأستاذة|الدكتور|الدكتورة|أ|د|م)\.?\s+/, '').trim(); return c ? c[0] : '؟'; };
const groupByDate = list => { const m = new Map(); list.forEach(s => { if (!m.has(s.date)) m.set(s.date, []); m.get(s.date).push(s); }); return [...m]; };

/* ============ البيانات ============ */
function seed() {
  const T = [
    { name: 'أ. محمد السيد', subjects: ['رياضيات', 'فيزياء'], bio: 'خبرة 10 سنوات في تدريس الرياضيات والفيزياء للمرحلة الثانوية.' },
    { name: 'أ. سارة أحمد', subjects: ['لغة إنجليزية'], bio: 'متخصصة في المحادثة والقواعد والتحضير لاختبارات اللغة.' },
    { name: 'د. أحمد حسن', subjects: ['كيمياء', 'أحياء'], bio: 'مدرّس علوم يشرح المفاهيم بطريقة مبسّطة وعملية.' },
    { name: 'أ. منى إبراهيم', subjects: ['لغة عربية', 'تاريخ'], bio: 'تهتم بالنحو والبلاغة وتبسيط المناهج الدراسية.' }
  ].map(t => ({ id: uid(), active: true, ...t }));
  const times = ['15:00', '17:00', '19:00'], today = new Date(), slots = [];
  for (let d = 1; d <= 6; d++) T.forEach((t, ti) => {
    for (let k = 0; k < 2; k++) {
      slots.push({ id: uid(), teacherId: t.id, subject: t.subjects[(d + k) % t.subjects.length],
        date: isoDate(addDays(today, d)), time: times[(d + ti + k) % 3], duration: 60 });
    }
  });
  return { teachers: T, slots, bookings: [] };
}
function validData(d) {
  return d && Array.isArray(d.teachers) && Array.isArray(d.slots) && Array.isArray(d.bookings)
    && d.teachers.every(t => t && typeof t.id === 'string' && typeof t.name === 'string' && Array.isArray(t.subjects))
    && d.slots.every(s => s && typeof s.id === 'string' && typeof s.teacherId === 'string' && typeof s.subject === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s.date) && /^\d{2}:\d{2}$/.test(s.time) && Number(s.duration) > 0)
    && d.bookings.every(b => b && typeof b.id === 'string' && typeof b.studentName === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(b.date) && /^\d{2}:\d{2}$/.test(b.time) && Number(b.duration) > 0);
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); if (validData(d)) return d; }
  } catch {}
  const d = seed();
  try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {}
  return d;
}
let db = load();
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); return true; }
  catch { toast('تعذّر حفظ البيانات في المتصفح', 'error'); return false; }
}

const teacherById = id => db.teachers.find(t => t.id === id);
const availSlots = (f = {}) => db.slots.filter(s => !s.bookingId && !isPast(s) && teacherById(s.teacherId)?.active
  && (!f.teacherId || s.teacherId === f.teacherId) && (!f.subject || s.subject === f.subject)).sort(bySlot);
const statusOf = b => b.status === 'cancelled' ? 'cancelled' : (isPast(b) ? 'done' : 'upcoming');
const STATUS_LABEL = { upcoming: 'مؤكد', done: 'منتهي', cancelled: 'ملغي' };
const STATUS_BADGE = { upcoming: 'ok', done: 'muted', cancelled: 'danger' };

/* ============ الحالة ============ */
const ui = {
  view: 'book', step: 1, subject: null, teacherId: null, slotId: null, done: null,
  phone: lsGet('tb_phone'), name: lsGet('tb_name'),
  admin: ssGet('tb_admin') === '1', adminTab: 'stats',
  slotTeacher: '', slotFilterTeacher: '', showPast: false,
  bkStatus: 'all', bkTeacher: '', bkQuery: '',
  fails: 0, lockUntil: 0
};
const getPin = () => lsGet(PIN_KEY, '1234');

/* ============ واجهة مساعدة: Toast / Modal ============ */
function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = 'toast ' + type; el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.classList.add('out'), 2800);
  setTimeout(() => el.remove(), 3300);
}
let pendingConfirm = null;
function openModal(html) {
  $('#modal-root').innerHTML = `<div class="backdrop" data-act="modal-close"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.classList.add('noscroll');
  const f = $('#modal-root').querySelector('input:not([type=hidden]),select,textarea'); if (f) f.focus();
}
function closeModal() {
  if (pendingConfirm) { const r = pendingConfirm; pendingConfirm = null; r(false); }
  $('#modal-root').innerHTML = '';
  document.body.classList.remove('noscroll');
}
function confirmDialog({ title, message, okText = 'تأكيد', danger = false }) {
  return new Promise(res => {
    openModal(`<h3>${esc(title)}</h3><p class="muted">${esc(message)}</p>
      <div class="modal-actions"><button class="btn ${danger ? 'danger' : ''}" data-act="confirm-ok">${esc(okText)}</button>
      <button class="btn ghost" data-act="confirm-cancel">تراجع</button></div>`);
    pendingConfirm = res;
  });
}

function submitBooking(f) {
  const fd = new FormData(f), err = $('#form-err');
  const name = String(fd.get('name')).trim(), phone = String(fd.get('phone')).trim(), notes = String(fd.get('notes')).trim();
  const fail = m => { err.textContent = m; };
  if (name.length < 3) return fail('يرجى إدخال الاسم الكامل (3 أحرف على الأقل).');
  const np = normPhone(phone);
  if (np.length < 8 || np.length > 15) return fail('يرجى إدخال رقم هاتف صحيح.');
  const s = db.slots.find(x => x.id === ui.slotId);
  if (!s || s.bookingId || isPast(s)) {
    toast('عذراً، هذا الموعد لم يعد متاحاً. اختر موعداً آخر.', 'error');
    ui.step = 3; ui.slotId = null; render(); return;
  }
  if (db.bookings.some(b => b.status === 'confirmed' && samePhone(b.phone, phone) && overlaps(b, s)))
    return fail('لديك حجز آخر في نفس الوقت.');
  const t = teacherById(s.teacherId);
  const b = { id: uid(), slotId: s.id, teacherId: s.teacherId, teacherName: t?.name || '—', subject: s.subject,
    date: s.date, time: s.time, duration: s.duration, studentName: name, phone, notes, status: 'confirmed', createdAt: new Date().toISOString() };
  s.bookingId = b.id; db.bookings.push(b);
  if (!persist()) { delete s.bookingId; db.bookings.pop(); return; }
  ui.name = name; ui.phone = phone; lsSet('tb_name', name); lsSet('tb_phone', phone);
  ui.done = b; ui.step = 5; render(); scrollTop();
}

async function cancelBooking(id, byAdmin) {
  const b = db.bookings.find(x => x.id === id);
  if (!b || statusOf(b) !== 'upcoming') return;
  const ok = await confirmDialog({ title: 'إلغاء الحجز', message: `هل تريد إلغاء درس ${b.subject} مع ${b.teacherName} يوم ${fmtDate(b.date)} الساعة ${fmtTime(b.time)}؟`, okText: 'نعم، إلغاء الحجز', danger: true });
  if (!ok) return;
  b.status = 'cancelled'; b.cancelledAt = new Date().toISOString(); b.cancelledBy = byAdmin ? 'admin' : 'student';
  const s = db.slots.find(x => x.id === b.slotId);
  if (s && s.bookingId === b.id) delete s.bookingId;
  persist(); toast('تم إلغاء الحجز'); render();
}

    <label class="btn ghost" style="cursor:pointer;margin:0">⬆️ استيراد JSON<input type="file" accept="application/json,.json" data-import hidden></label></div></div>
  <div class="card stack"><h3>إدارة البيانات</h3>
    <div class="row"><button class="btn ghost" data-act="reset-demo">استعادة بيانات تجريبية</button><button class="btn danger" data-act="clear-all">مسح كل البيانات</button></div></div></div>`;
}

/* ============ العرض ============ */
function render() {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.view === ui.view));
  $('#app').innerHTML = ui.view === 'book' ? renderBook() : ui.view === 'mine' ? renderMine() : renderAdmin();
}

/* ============ الأحداث ============ */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, d = el.dataset;
  if (a === 'modal-close' && e.target !== el && !e.target.matches('button')) return;
  switch (a) {
    case 'nav': ui.view = d.view; if (ui.view === 'book' && ui.step === 5) resetBook(); render(); scrollTop(); break;
    case 'pick-subject': ui.subject = d.v; ui.teacherId = ui.slotId = null; ui.step = 2; render(); scrollTop(); break;
    case 'pick-teacher': ui.teacherId = d.id; ui.slotId = null; ui.step = 3; render(); scrollTop(); break;
    case 'pick-slot': ui.slotId = d.id; ui.step = 4; render(); scrollTop(); break;
    case 'back': ui.step = Math.max(1, ui.step - 1); if (ui.step < 4) ui.slotId = null; if (ui.step < 3) ui.teacherId = null; render(); scrollTop(); break;
    case 'new-booking': resetBook(); ui.view = 'book'; render(); scrollTop(); break;
    case 'go-mine': ui.view = 'mine'; render(); scrollTop(); break;
    case 'cancel-booking': await cancelBooking(d.id, ui.view === 'admin'); break;
    case 'modal-close': case 'confirm-cancel': closeModal(); break;
    case 'confirm-ok': { const r = pendingConfirm; pendingConfirm = null; closeModal(); r && r(true); break; }
    case 'admin-tab': ui.adminTab = d.tab; render(); break;
    case 'admin-logout': ui.admin = false; ssSet('tb_admin', null); render(); break;
    case 'teacher-add': teacherModal(); break;
    case 'teacher-edit': teacherModal(d.id); break;
    case 'teacher-toggle': { const t = teacherById(d.id); if (t) { t.active = !t.active; persist(); render(); } break; }
    case 'teacher-delete': {
      const t = teacherById(d.id); if (!t) break;
      const n = db.bookings.filter(b => b.teacherId === t.id && statusOf(b) === 'upcoming').length;
      if (await confirmDialog({ title: 'حذف المدرس', message: `سيتم حذف «${t.name}» وجميع مواعيده${n ? ` وإلغاء ${n} حجز قادم` : ''}. لا يمكن التراجع.`, okText: 'حذف', danger: true })) {
        db.bookings.forEach(b => { if (b.teacherId === t.id && statusOf(b) === 'upcoming') { b.status = 'cancelled'; b.cancelledAt = new Date().toISOString(); b.cancelledBy = 'admin'; } });
        db.slots = db.slots.filter(s => s.teacherId !== t.id);
        db.teachers = db.teachers.filter(x => x.id !== t.id);
        persist(); toast('تم حذف المدرس'); render();
      }
      break;
    }
    case 'slot-delete': db.slots = db.slots.filter(s => !(s.id === d.id && !s.bookingId)); persist(); toast('تم حذف الموعد'); render(); break;
    case 'slots-cleanup': {
      const n = db.slots.filter(s => isPast(s) && !s.bookingId).length;
      if (!n) { toast('لا توجد مواعيد منتهية للحذف'); break; }
      if (await confirmDialog({ title: 'تنظيف المواعيد', message: `سيتم حذف ${n} موعد منتهٍ غير محجوز.`, okText: 'حذف' })) {
        db.slots = db.slots.filter(s => !(isPast(s) && !s.bookingId)); persist(); toast('تم التنظيف'); render();
      }
      break;
    }
    case 'booking-delete': {
      const b = db.bookings.find(x => x.id === d.id); if (!b) break;
      if (await confirmDialog({ title: 'حذف سجل الحجز', message: `سيُحذف سجل حجز ${b.studentName} نهائياً${statusOf(b) === 'upcoming' ? ' وسيُعاد الموعد متاحاً' : ''}.`, okText: 'حذف', danger: true })) {
        const s = db.slots.find(x => x.id === b.slotId); if (s && s.bookingId === b.id) delete s.bookingId;
        db.bookings = db.bookings.filter(x => x.id !== b.id); persist(); toast('تم حذف السجل'); render();
      }
      break;
    }
    case 'export': exportData(); break;
    case 'reset-demo':
      if (await confirmDialog({ title: 'استعادة بيانات تجريبية', message: 'سيتم استبدال كل البيانات الحالية ببيانات تجريبية.', okText: 'استبدال', danger: true })) { db = seed(); persist(); toast('تمت الاستعادة'); resetBook(); render(); }
      break;
    case 'clear-all':
      if (await confirmDialog({ title: 'مسح كل البيانات', message: 'سيتم حذف المدرسين والمواعيد والحجوزات نهائياً.', okText: 'مسح الكل', danger: true })) { db = { teachers: [], slots: [], bookings: [] }; persist(); toast('تم المسح'); resetBook(); render(); }
      break;
  }
});
function resetBook() { ui.step = 1; ui.subject = ui.teacherId = ui.slotId = ui.done = null; }

document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const fd = new FormData(f), err = () => $('#form-err');
  switch (f.dataset.form) {
    case 'book': submitBooking(f); break;
    case 'lookup': ui.phone = String(fd.get('phone')).trim(); lsSet('tb_phone', ui.phone); render(); break;
    case 'login': {
      if (Date.now() < ui.lockUntil) { err().textContent = 'محاولات كثيرة، انتظر قليلاً ثم أعد المحاولة.'; break; }
      if (String(fd.get('pin')) === getPin()) { ui.admin = true; ui.fails = 0; ssSet('tb_admin', '1'); render(); }
      else { ui.fails++; if (ui.fails >= 5) { ui.lockUntil = Date.now() + 30000; ui.fails = 0; } err().textContent = 'الرمز غير صحيح.'; }
      break;
    }
    case 'teacher': {
      const tid = String(fd.get('tid')), name = String(fd.get('name')).trim(), subjects = parseSubjects(fd.get('subjects'));
      if (name.length < 2) { err().textContent = 'يرجى إدخال اسم المدرس.'; break; }
      if (!subjects.length) { err().textContent = 'أضف مادة واحدة على الأقل.'; break; }
      const bio = String(fd.get('bio')).trim(), active = fd.get('active') === 'on';
      if (tid) {
        const t = teacherById(tid); if (!t) break;
        Object.assign(t, { name, subjects, bio, active });
        db.slots = db.slots.filter(s => !(s.teacherId === tid && !s.bookingId && !subjects.includes(s.subject)));
        db.bookings.forEach(b => { if (b.teacherId === tid) b.teacherName = name; });
      } else db.teachers.push({ id: uid(), name, subjects, bio, active });
      persist(); closeModal(); toast('تم الحفظ'); render(); break;
    }
    case 'slot': {
      const teacherId = String(fd.get('teacherId')), subject = String(fd.get('subject')), date = String(fd.get('date')), time = String(fd.get('time'));
      const duration = Number(fd.get('duration')), weeks = Math.min(12, Math.max(1, parseInt(fd.get('weeks')) || 1));
      if (!subject || !date || !time) { err().textContent = 'أكمل جميع الحقول.'; break; }
      ui.slotTeacher = teacherId;
      let added = 0, skipped = 0;
      for (let i = 0; i < weeks; i++) {
        const s = { id: uid(), teacherId, subject, date: isoDate(addDays(parseISO(date), 7 * i)), time, duration };
        if (isPast(s) || db.slots.some(x => x.teacherId === teacherId && overlaps(x, s))) { skipped++; continue; }
        db.slots.push(s); added++;
      }
      if (!added) { err().textContent = 'لم تتم الإضافة: الموعد في الماضي أو يتعارض مع موعد آخر للمدرس.'; break; }
      persist(); toast(`تمت إضافة ${added} موعد${skipped ? ` (تخطّي ${skipped})` : ''}`); render(); break;
    }
    case 'pin': {
      if (String(fd.get('cur')) !== getPin()) { err().textContent = 'الرمز الحالي غير صحيح.'; break; }
      const n = String(fd.get('new'));
      if (n.length < 4) { err().textContent = 'الرمز الجديد قصير جداً.'; break; }
      if (n !== String(fd.get('new2'))) { err().textContent = 'تأكيد الرمز غير مطابق.'; break; }
      lsSet(PIN_KEY, n); toast('تم تغيير الرمز'); f.reset(); break;
    }
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('#slot-form [name=teacherId]')) {
    ui.slotTeacher = t.value; t.form.elements.subject.innerHTML = subjectOptions(t.value); return;
  }
  if (t.dataset.filter) { ui[t.dataset.filter] = t.type === 'checkbox' ? t.checked : t.value; render(); return; }
  if (t.matches('[data-import]')) importData(t);
});
document.addEventListener('input', e => {
  const k = e.target.dataset.live; if (!k) return;
  ui[k] = e.target.value; const box = $('#bk-list'); if (box) box.innerHTML = adminBookingsList();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal-root').firstChild) closeModal(); });
window.addEventListener('storage', e => { if (e.key === KEY) { db = load(); if (!$('#modal-root').firstChild) render(); } });

/* ============ تصدير / استيراد ============ */
function exportData() {
  const blob = new Blob([JSON.stringify({ app: 'tutor-booking', version: 1, exportedAt: new Date().toISOString(), teachers: db.teachers, slots: db.slots, bookings: db.bookings }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `tutor-backup-${isoDate(new Date())}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importData(input) {
  const file = input.files[0]; input.value = ''; if (!file) return;
  const r = new FileReader();
  r.onload = async () => {
    let o; try { o = JSON.parse(r.result); } catch { return toast('الملف غير صالح', 'error'); }
    if (!validData(o)) return toast('بنية الملف غير صحيحة', 'error');
    if (await confirmDialog({ title: 'استيراد البيانات', message: 'سيتم استبدال كل البيانات الحالية بمحتوى الملف.', okText: 'استيراد', danger: true })) {
      db = { teachers: o.teachers, slots: o.slots, bookings: o.bookings }; persist(); toast('تم الاستيراد'); render();
    }
  };
  r.readAsText(file);
}

render();
})();
</script>
</body>
</html>
